<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live TV Player (M3U8/TS)</title>
    <!-- Tailwind CSS CDN for modern, responsive styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HLS.js CDN for M3U8/HLS streaming support -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.0"></script>
    <style>
        /* Përdorimi i një font-i modern për ndjesi të avancuar */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0d1117; /* Sfond i errët për ndjesi kinemaje */
            color: #e5e7eb;
            overflow: hidden; /* Heq scroll-in e faqes kryesore */
            transition: background-color 0.3s;
        }
        
        /* Stilizim i Forcëzuar i Fokusit (Pop-up Effect) */
        .interactive-item:focus {
            background-color: #3b82f6 !important; 
            color: white !important;
            transform: scale(1.10); /* Zmadhim më i theksuar për TV */
            box-shadow: 0 16px 40px rgba(59, 130, 246, 0.7); 
            outline: none;
            z-index: 10;
        }

        /* Klasa e re për të trajtuar fokusin e elementeve interaktive */
        .category-card, .channel-item {
            transition: transform 0.3s ease-in-out, box-shadow 0.3s ease-in-out, background-color 0.3s;
            cursor: pointer;
        }

        /* Stili i kanalit aktual që po luhet */
        .channel-item.active {
            background-color: #2563eb; 
            color: white;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
        }

        /* Fsheh ekranin e kategorive kur jemi në ekranin e kanaleve */
        .hidden-category-screen {
            display: none !important;
        }

        /* Stilizimi i Video Player-it */
        #video-player {
            width: 100%;
            height: 100%;
            position: fixed;
            top: 0;
            left: 0;
        }
        
        /* Stilizimi për listën e kanaleve */
        #channel-list {
            max-height: calc(100vh - 150px); /* Llogarit lartësinë e mbetur */
        }
    </style>
</head>
<body class="min-h-screen">

    <!-- Kontejneri Kryesor i Faqes (Përdoret për të fshehur/shfaqur faqet) -->
    <div id="main-container" class="min-h-screen">

        <!-- Ekrani 1: Faqja Kryesore - Vetëm Kategoritë -->
        <div id="category-screen" class="flex flex-col items-center justify-center min-h-screen p-8">
            <h1 class="text-5xl font-extrabold text-white mb-12">Zgjidhni Kategorinë</h1>
            
            <div id="category-cards-container" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-8 w-full max-w-6xl">
                <!-- Kartat e Kategorive do të gjenerohen këtu -->
            </div>
        </div>

        <!-- Ekrani 2: Faqja e Kanaleve - Listë dhe Player (Fillimisht i Fshehur) -->
        <div id="channels-screen" class="hidden min-h-screen flex flex-col">
            
            <header class="p-4 bg-gray-900 shadow-xl border-b border-gray-700 flex justify-between items-center">
                <button id="back-button" class="interactive-item px-4 py-2 bg-gray-700 text-white rounded-lg font-semibold" tabindex="0">
                    < Back
                </button>
                <h1 id="current-category-title" class="text-3xl font-extrabold text-white">Live TV</h1>
                <div class="w-20"></div> <!-- Placeholder për qendërsim -->
            </header>

            <!-- Kontejneri kryesor Player dhe Lista -->
            <div class="flex flex-col lg:flex-row flex-grow">
                
                <!-- Seksioni 2: Player (Zgjedhja e Kanalit) -->
                <main class="lg:w-3/4 p-4 lg:p-6 flex flex-col space-y-4">
                    
                    <!-- Kontejneri i Video Player-it për t'u shfaqur si 'thumbnail' -->
                    <div class="relative bg-black rounded-xl shadow-2xl overflow-hidden aspect-video">
                        <video id="video-preview-player" playsinline class="rounded-xl w-full h-full"></video>
                        <div id="preview-message" class="absolute inset-0 flex items-center justify-center text-white text-3xl font-bold bg-black/70">
                            Zgjidhni një kanal për t'u luajtur
                        </div>
                    </div>

                    <!-- Informacioni i Kanalit -->
                    <div class="bg-gray-800 p-4 rounded-xl shadow-lg">
                        <p class="text-lg font-semibold text-blue-400">Tani i përzgjedhur:</p>
                        <p id="current-channel-info" class="text-2xl font-bold text-white">Nuk ka kanal të përzgjedhur.</p>
                    </div>
                </main>

                <!-- Seksioni 3: Lista e Kanaleve -->
                <aside class="lg:w-1/4 bg-gray-900 p-4 lg:p-6 shadow-2xl flex flex-col rounded-t-2xl lg:rounded-t-none lg:rounded-l-2xl">
                    
                    <h2 class="text-2xl font-bold mb-3 text-white border-b border-gray-700 pb-2">Kanalet</h2>

                    <div id="channel-list" class="flex-grow space-y-2 overflow-y-auto pr-1">
                        <!-- Kanale do të gjenerohen këtu -->
                    </div>

                </aside>
            </div>
        </div>
        
    </div>

    <!-- Seksioni Fullscreen Video (I fshehur derisa të luhet kanali) -->
    <div id="fullscreen-player-container" class="fixed inset-0 bg-black z-50 hidden">
        <!-- Vini re: Pa controls, me autoplay, muted=false, dhe playsinline -->
        <video id="fullscreen-video-player" autoplay playsinline muted=false class="w-full h-full"></video>
    </div>

<script>
    // Konfigurimi i kanalit (URL-të e vërteta m3u8 duhet të vendosen këtu)
    const channels = {
        'Live TV': [
            { name: 'Demo TV 1', url: 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8' },
            { name: 'Demo TV 2', url: 'https://devstreaming-cdn.apple.com/videos/streaming/examples/img_bipbop_adv_example_fmp4/master.m3u8' },
            { name: 'Lajme Global', url: 'https://bitdash-a.akamaihd.net/content/sintel/hls/playlist.m3u8' },
            { name: 'Komedie Klasike', url: 'https://cph-p2p-msl.akamaized.net/hls/live/2000341/test/master.m3u8' }
        ],
        'Sport': [
            { name: 'Futboll Demo', url: 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8' },
            { name: 'Basketboll', url: 'https://devstreaming-cdn.apple.com/videos/streaming/examples/img_bipbop_adv_example_fmp4/master.m3u8' },
            { name: 'Garat e Makinave', url: 'https://bitdash-a.akamaihd.net/content/sintel/hls/playlist.m3u8' },
            { name: 'Tenis', url: 'https://cph-p2p-msl.akamaized.net/hls/live/2000341/test/master.m3u8' }
        ],
        'Filma': [
            { name: 'Aksion HD', url: 'https://devstreaming-cdn.apple.com/videos/streaming/examples/img_bipbop_adv_example_fmp4/master.m3u8' },
            { name: 'Romancë', url: 'https://bitdash-a.akamaihd.net/content/sintel/hls/playlist.m3u8' },
            { name: 'Triller', url: 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8' },
            { name: 'Fantazi', url: 'https://cph-p2p-msl.akamaized.net/hls/live/2000341/test/master.m3u8' }
        ],
        'Doku': [
            { name: 'Natyrë', url: 'https://bitdash-a.akamaihd.net/content/sintel/hls/playlist.m3u8' },
            { name: 'Histori', url: 'https://devstreaming-cdn.apple.com/videos/streaming/examples/img_bipbop_adv_example_fmp4/master.m3u8' },
            { name: 'Shkencë', url: 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8' },
            { name: 'Udhëtim', url: 'https://cph-p2p-msl.akamaized.net/hls/live/2000341/test/master.m3u8' }
        ],
        'Fëmijë': [
            { name: 'Vizatimor 1', url: 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8' },
            { name: 'Vizatimor 2', url: 'https://bitdash-a.akamaihd.net/content/sintel/hls/playlist.m3u8' },
            { name: 'Këngë për Fëmijë', url: 'https://devstreaming-cdn.apple.com/videos/streaming/examples/img_bipbop_adv_example_fmp4/master.m3u8' },
            { name: 'Përralla', url: 'https://cph-p2p-msl.akamaized.net/hls/live/2000341/test/master.m3u8' }
        ]
    };

    let hls = null;
    let currentCategory = ''; 
    let currentVideoElement = null; // Mban referencën e lojtarit aktual

    const categoryScreen = document.getElementById('category-screen');
    const channelsScreen = document.getElementById('channels-screen');
    const categoryCardsContainer = document.getElementById('category-cards-container');
    const channelListContainer = document.getElementById('channel-list');
    const currentCategoryTitle = document.getElementById('current-category-title');
    const currentChannelInfo = document.getElementById('current-channel-info');
    const backButton = document.getElementById('back-button');
    
    // Video Player-at
    const videoPreview = document.getElementById('video-preview-player');
    const videoFullscreen = document.getElementById('fullscreen-video-player');
    const fullscreenContainer = document.getElementById('fullscreen-player-container');
    const previewMessage = document.getElementById('preview-message');

    /**
     * Përdor HLS.js për të ngarkuar dhe luajtur transmetimin në elementin e caktuar video.
     * @param {string} url - URL e transmetimit (p.sh., .m3u8)
     * @param {HTMLVideoElement} targetVideo - Elementi <video> ku do të luhet
     * @param {string} name - Emri i kanalit
     */
    function loadChannel(url, targetVideo, name) {
        if (!url) return;

        // Shkatërron instancën e mëparshme të HLS nëse ekziston
        if (hls && hls.media === targetVideo) {
            hls.destroy();
            hls = null;
        }

        currentVideoElement = targetVideo;

        // Nëse është lojtari i ri, shfaq mesazhin e ngarkimit nëse nuk është fullscreen
        if (targetVideo !== videoFullscreen) {
            currentChannelInfo.textContent = `Ngarkohet: ${name}...`;
            previewMessage.textContent = 'Ngarkohet...';
            previewMessage.classList.remove('hidden');
        }

        if (Hls.isSupported()) {
            hls = new Hls({
                // Konfigurime shtesë për rikuperim të gabimeve në TV
                liveSyncDuration: 1.5,
                liveMaxLatencyDuration: 10,
            });
            hls.attachMedia(targetVideo);
            
            hls.on(Hls.Events.MEDIA_ATTACHED, function () {
                hls.loadSource(url);
            });

            hls.on(Hls.Events.MANIFEST_PARSED, function () {
                targetVideo.play().catch(e => {
                    // Për desktop/mobile, mund të duhet një klikim i përdoruesit
                    console.log("Autoplay dështoi.", e); 
                });
                if (targetVideo !== videoFullscreen) {
                    currentChannelInfo.textContent = name;
                    previewMessage.classList.add('hidden');
                }
            });

            hls.on(Hls.Events.ERROR, function (event, data) {
                console.error("HLS Error:", data);
                if (data.fatal) {
                    // Logjikë rikuperimi
                    if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
                        hls.startLoad();
                    } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
                        hls.recoverMediaError();
                    }
                }
                if (targetVideo !== videoFullscreen) {
                    currentChannelInfo.textContent = `Gabim: ${name} (Kontrollo URL)`;
                    previewMessage.textContent = 'Gabim gjatë luajtjes.';
                    previewMessage.classList.remove('hidden');
                }
            });

        } else if (targetVideo.canPlayType('application/vnd.apple.mpegurl')) {
            // Për shfletuesit që mbështesin natyrisht HLS (p.sh., Safari, iOS)
            targetVideo.src = url;
            targetVideo.addEventListener('loadedmetadata', function() {
                targetVideo.play();
            });
            if (targetVideo !== videoFullscreen) {
                currentChannelInfo.textContent = name;
                previewMessage.classList.add('hidden');
            }
        } else {
             // Mesazh gabimi nëse HLS nuk mbështetet
             if (targetVideo !== videoFullscreen) {
                currentChannelInfo.textContent = `Nuk mbështetet lojtari: ${name}`;
                previewMessage.textContent = 'Nuk mbështetet HLS.';
                previewMessage.classList.remove('hidden');
            }
        }
    }

    /**
     * Kalon në ekranin e kanaleve dhe ngarkon listën e kanaleve të kategorisë së zgjedhur.
     */
    function goToChannelsScreen(category) {
        currentCategory = category;
        currentCategoryTitle.textContent = category;
        
        categoryScreen.classList.add('hidden');
        channelsScreen.classList.remove('hidden');
        
        renderChannels();

        // Fokuson butonin e kthimit për navigim të menjëhershëm D-Pad
        setTimeout(() => {
            backButton.focus();
        }, 100);
    }

    /**
     * Kthehet në ekranin kryesor të kategorive.
     */
    function goToCategoryScreen() {
        // Ndalohet çdo lojtar preview aktual
        if (hls) {
            hls.destroy();
            hls = null;
        }
        videoPreview.pause();
        videoPreview.removeAttribute('src');
        videoPreview.load();

        channelsScreen.classList.add('hidden');
        categoryScreen.classList.remove('hidden');

        // Përditëson informacionin
        currentChannelInfo.textContent = 'Nuk ka kanal të përzgjedhur.';
        previewMessage.textContent = 'Zgjidhni një kanal për t\'u luajtur';
        previewMessage.classList.remove('hidden');
        
        // Fokuson kartën e parë të kategorisë për navigim
        setTimeout(() => {
            const firstCard = categoryCardsContainer.querySelector('.category-card');
            if (firstCard) {
                firstCard.focus();
            }
        }, 100);
    }
    
    /**
     * Nis modalitetin fullscreen pa kontrolle.
     */
    function enterFullscreen(url, name) {
        // Ndalohet lojtari preview
        if (hls) {
            hls.destroy();
            hls = null;
        }
        videoPreview.pause();

        fullscreenContainer.classList.remove('hidden');
        
        // Luhet në lojtarin fullscreen
        loadChannel(url, videoFullscreen, name);
        
        // Kërkon Fullscreen nga shfletuesi
        if (fullscreenContainer.requestFullscreen) {
            fullscreenContainer.requestFullscreen();
        } else if (fullscreenContainer.webkitRequestFullscreen) { /* Safari */
            fullscreenContainer.webkitRequestFullscreen();
        } else if (fullscreenContainer.msRequestFullscreen) { /* IE11 */
            fullscreenContainer.msRequestFullscreen();
        }
    }

    /**
     * Del nga modaliteti fullscreen
     */
    function exitFullscreen() {
        if (document.exitFullscreen) {
            document.exitFullscreen();
        } else if (document.webkitExitFullscreen) { /* Safari */
            document.webkitExitFullscreen();
        } else if (document.msExitFullscreen) { /* IE11 */
            document.msExitFullscreen();
        }

        // Shkatërron lojtarin fullscreen
        if (hls) {
            hls.destroy();
            hls = null;
        }
        videoFullscreen.pause();
        videoFullscreen.removeAttribute('src');
        videoFullscreen.load();

        fullscreenContainer.classList.add('hidden');
        
        // Kthehet te lojtari preview me kanalin e ri (ose kanalin e fundit të luajtur)
        const activeChannel = document.querySelector('.channel-item.active');
        if (activeChannel) {
            loadChannel(activeChannel.dataset.url, videoPreview, activeChannel.dataset.name);
            activeChannel.focus(); // Rikthen fokusin te kanali i zgjedhur
        } else {
            // Kthehet në ekranin kryesor nëse nuk ka kanal aktiv
            goToCategoryScreen(); 
        }
    }

    /**
     * Ndërton kartat e kategorive.
     */
    function renderCategoryCards() {
        categoryCardsContainer.innerHTML = ''; 
        const categories = Object.keys(channels);

        categories.forEach(category => {
            const card = document.createElement('div');
            card.className = 'category-card interactive-item bg-gray-800 p-8 rounded-2xl shadow-xl hover:bg-gray-700 text-center font-bold text-3xl h-48 flex items-center justify-center';
            card.textContent = category;
            card.setAttribute('tabindex', '0'); // Për fokusin e telekomandës
            
            // Menaxhimi i klikimit (Enter me telekomandë ose Click me mouse)
            card.addEventListener('click', () => {
                goToChannelsScreen(category);
            });
            
            card.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    goToChannelsScreen(category);
                }
            });

            categoryCardsContainer.appendChild(card);
        });
        
        // Fokusimi fillestar te karta e parë
        setTimeout(() => {
            const firstCard = categoryCardsContainer.querySelector('.category-card');
            if (firstCard) {
                firstCard.focus();
            }
        }, 300);
    }
    
    /**
     * Ndërton listën e kanaleve për kategorinë aktuale.
     */
    function renderChannels() {
        const channelList = channels[currentCategory] || [];
        channelListContainer.innerHTML = ''; 
        
        channelList.forEach((channel, index) => {
            const channelItem = document.createElement('div');
            channelItem.className = 'channel-item interactive-item flex items-center p-3 rounded-lg hover:bg-gray-700/80';
            channelItem.setAttribute('tabindex', '0'); 
            channelItem.setAttribute('data-url', channel.url);
            channelItem.setAttribute('data-name', channel.name);
            
            const icon = document.createElement('div');
            icon.className = 'w-8 h-8 bg-blue-500 rounded-full flex items-center justify-center text-sm font-bold mr-3 flex-shrink-0';
            icon.textContent = channel.name.charAt(0);
            
            const nameElement = document.createElement('span');
            nameElement.className = 'text-base font-medium truncate';
            nameElement.textContent = channel.name;

            channelItem.appendChild(icon);
            channelItem.appendChild(nameElement);

            // Zgjedhja e kanalit (Luhet menjëherë në Fullscreen)
            channelItem.addEventListener('click', () => {
                document.querySelectorAll('.channel-item').forEach(item => item.classList.remove('active'));
                channelItem.classList.add('active');
                currentChannelInfo.textContent = channel.name;
                // Nis luajtjen në Fullscreen
                enterFullscreen(channel.url, channel.name);
            });
            
            // Për Telecommandën (Enter)
            channelItem.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    channelItem.click();
                }
            });

            channelListContainer.appendChild(channelItem);
        });
    }

    // Inicializimi i aplikacionit
    window.onload = function() {
        renderCategoryCards();
        
        // Kthehu butoni
        backButton.addEventListener('click', goToCategoryScreen);
        backButton.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                goToCategoryScreen();
            }
        });

        // Dëgjuesi për daljen nga fullscreen (me butonin 'Back' ose 'Esc' të telekomandës)
        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) {
                // Nëse jemi duke dalë nga fullscreen, kthehemi në ekranin e kanaleve
                exitFullscreen();
            }
        });
        document.addEventListener('webkitfullscreenchange', () => {
             if (!document.webkitIsFullScreen) { exitFullscreen(); }
        });
        document.addEventListener('msfullscreenchange', () => {
            if (!document.msFullscreenElement) { exitFullscreen(); }
        });
        
    };

    // Vendosja e nivelit të regjistrimit për HLS.js
    if (Hls.isSupported()) {
        Hls.DefaultConfig.debug = true; 
    }

</script>

</body>
</html>
