<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Live IPTV (Dizajn Modern)</title>
    <!-- Tailwind CSS CDN for modern, responsive styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- HLS.js për riprodhimin e M3U8/HLS (Përkrahja që funksionon) -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    
    <style>
        /* Përdorimi i një font-i modern për ndjesi të avancuar */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0d1117; 
            color: #e5e7eb;
            overflow: hidden; 
        }

        /* Klasa Bazë për të gjitha Elementet Interaktive */
        .interactive-item {
            transition: transform 0.3s ease-in-out, box-shadow 0.3s ease-in-out, background-color 0.3s;
            cursor: pointer;
            outline: none; 
            border: 2px solid transparent; 
        }
        
        /* ---------------------------------------------------- */
        /* EFEKTI I FOKUSIT (Si Tele-Komandë/TV) */
        /* ---------------------------------------------------- */
        
        .category-card:focus {
            transform: scale(1.15) perspective(1px); 
            background: linear-gradient(135deg, #1d4ed8 0%, #3b82f6 100%) !important;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.9), 0 0 5px rgba(59, 130, 246, 0.5); 
            z-index: 100;
            border-color: #3b82f6 !important;
        }
        
        /* Kanali - në listë ose OSD */
        .channel-item:focus, .osd-channel-item:focus {
            background-color: #1f2937 !important; 
            transform: scale(1.03) perspective(1px); 
            border: 2px solid #3b82f6; 
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.6); 
        }

        .channel-item.active, .osd-channel-item.active {
            background-color: #2563eb; 
            color: white;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
            font-weight: 700;
        }

        .category-card {
            border: 1px solid #374151; 
            background-color: #1f2937;
            text-shadow: 1px 1px 2px #000;
        }

        /* OSD Menu (Overlay) - Stili fillestar për t'u fshehur */
        #osd-menu {
            transform: translateX(-100%); 
        }
        #osd-menu.active {
            transform: translateX(0); 
        }

        /* Fsheh scrollbar-in */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        /* Fullscreen Player Container */
        #fullscreen-player-container {
            position: fixed;
            inset: 0;
            background: #000;
            display: none;
            z-index: 99999;
            align-items: center;
            justify-content: center;
        }

        /* Video element in fullscreen mode */
        #fullscreen-player-container video {
            width: 100vw;
            height: 100vh;
            object-fit: contain; /* Përdor 'contain' për të siguruar që video të shihet plotësisht */
            outline: none;
            border: 0;
        }
        
        /* UI Message Box (për Gabime) */
        #ui-message-box {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            width: 90%;
            max-width: 450px;
            background-color: #1f2937;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            padding: 24px;
            z-index: 10000;
            opacity: 0;
            transition: all 0.3s ease-out;
            pointer-events: none;
        }
        #ui-message-box.visible {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
            pointer-events: auto;
        }
    </style>
</head>
<body class="min-h-screen">

    <!-- Kontejneri Kryesor i Faqes -->
    <div id="main-container" class="min-h-screen">

        <!-- Ekrani 1: Faqja Kryesore - Kategoritë -->
        <div id="category-screen" class="flex flex-col items-center justify-center min-h-screen p-8">
            <h1 class="text-5xl font-extrabold text-blue-400 mb-16 tracking-wider">TV LIVE IPTV</h1>
            
            <div id="category-cards-container" class="flex flex-wrap justify-center gap-6 w-full max-w-7xl no-scrollbar overflow-x-auto">
                <!-- Kartat e Kategorive do të gjenerohen këtu -->
            </div>
            <p class="mt-12 text-gray-500 text-lg">Zgjidhni një kategori me OK, kanali i parë hapet në Fullscreen.</p>
        </div>

        <!-- Ekrani 2: Faqja e Kanaleve - NUK PËRDORET, por fshihet. -->
        <div id="channels-screen" class="hidden">
            <!-- Përdoret vetëm për strukturë, nuk shfaqet -->
            <button id="back-button" class="hidden" tabindex="-1"></button>
            <h1 id="current-category-title" class="hidden"></h1>
            <div id="channel-list-container" class="hidden"></div>
        </div>
        
    </div>

    <!-- Seksioni Fullscreen Video (I fshehur) -->
    <div id="fullscreen-player-container" class="fixed inset-0 bg-black z-50 hidden">
        <!-- Video elementi do të krijohet dinamikisht këtu -->
        
        <!-- OSD Menu (Overlay) - Shfaqet me butonin OK -->
        <div id="osd-menu" class="fixed top-0 left-0 h-full w-80 bg-gray-900/95 shadow-2xl transition-transform duration-300 p-4 pt-12 z-10">
            <h3 id="osd-menu-title" class="text-2xl font-bold mb-4 text-white border-b border-gray-700 pb-2">Kanalet e Kategorisë</h3>
            <div id="osd-channel-list" class="space-y-2 overflow-y-auto h-[80%] no-scrollbar">
                <!-- Kanale do të gjenerohen në kohë reale këtu -->
            </div>
            <div id="osd-info" class="absolute bottom-0 left-0 w-full bg-gray-800 p-3 text-sm text-gray-400 border-t border-gray-700">
                OK: Zgjidh | Back: Fsheh OSD | Esc/Menu: Kthehu
            </div>
        </div>
    </div>
    
    <!-- UI Message Box (për Gabime) -->
    <div id="ui-message-box">
        <h4 id="modal-title" class="text-xl font-bold mb-3 text-red-400"></h4>
        <p id="modal-message" class="text-gray-300 text-base mb-4"></p>
        <button id="modal-close-button" class="interactive-item w-full py-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg" tabindex="0">
            MBYLL
        </button>
    </div>

<script>
    let hlsInstance = null; // Instanca e HLS.js
    let currentVideoElement = null; // Referenca te tag-u <video>

    // Këto janë kanalet që funksionojnë sipas informacionit tuaj të fundit
    const channels = {
        "LIVE TV": [
            { name: "TOP CHANNEL", logo: "https://vimg.ipko.tv/logo/color/topchanel.png", url: "https://cf.business-cdn.me/live/FrancescoFili/e76dc66304/1221574.m3u8" },
            { name: "RTK 1", logo: "http://vimg.ipko.tv/logo/color/rtk1.png", url: "http://gjvideo-live-xk.gjirafa.net/gjvideo-livestream/98r-d35-487-v6m/tracks-v4a1/mono.ts.m3u8" },
            { name: "RTK 3", logo: "http://vimg.ipko.tv/logo/color/rtk3.png", url: "http://gjirafa-video-live.gjirafa.net/gjvideo-livestream/rtk3/tracks-v4a1/mono.ts.m3u8" },
            { name: "VIZION PLUS", logo: "https://vimg.ipko.tv/logo/color/vizionplus.png", url: "http://tringliveviz.akamaized.net/delta/105/out/u/qwaszxerdfcvrtryuy.m3u8" },
            { name: "KTV", logo: "http://vimg.ipko.tv/logo/color/ktv.png", url: "http://gjirafa-video-live.gjirafa.net/gjvideo-livestream/lj9-pxm-o53-rp0/tracks-v4a1/mono.ts.m3u8" },
        ],
        "FILMA": [ 
            { name: "Aksion HD", logo: "https://placehold.co/120x120/4b5563/ffffff?text=FILM+A", url: "https://devstreaming-cdn.apple.com/videos/streaming/examples/img_bipbop_adv_example_fmp4/master.m3u8" },
            { name: "Romancë", logo: "https://placehold.co/120x120/4b5563/ffffff?text=FILM+R", url: "https://bitdash-a.akamaihd.net/content/sintel/hls/playlist.m3u8" },
            { name: "Triller", logo: "https://placehold.co/120x120/4b5563/ffffff?text=FILM+T", url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8" },
        ],
        "SPORT": [ 
            { name: "Futboll Demo", logo: "https://placehold.co/120x120/10b981/ffffff?text=SPORT+F", url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8" },
            { name: "Basketboll", logo: "https://placehold.co/120x120/10b981/ffffff?text=SPORT+B", url: "https://devstreaming-cdn.apple.com/videos/streaming/examples/img_bipbop_adv_example_fmp4/master.m3u8" },
            { name: "Garat e Makinave", logo: "https://placehold.co/120x120/10b981/ffffff?text=SPORT+G", url: "https://bitdash-a.akamaihd.net/content/sintel/hls/playlist.m3u8" },
        ],
        "FEMIJE": [ 
            { name: "DISNEY JUNIOR", logo: "https://placehold.co/120x120/f97316/ffffff?text=FEMIJE+DJ", url: "https://fl1.moveonjoy.com/DISNEY_JR/index.m3u8" }, 
            { name: "AVATAR", logo: "https://placehold.co/120x120/f97316/ffffff?text=FEMIJE+A", url: "http://cfd-v4-service-channel-stitcher-use1-1.prd.pluto.tv/stitch/hls/channel/60b4c17a81e29300071d3a39/master.m3u8" }, 
        ],
        "DOKU": [ 
            { name: "NAT GEO", logo: "https://placehold.co/120x120/3b82f6/ffffff?text=DOKU+NG", url: "https://fl1.moveonjoy.com/National_Geographic/index.m3u8" }, 
            { name: "NAT GEO WILD", logo: "https://placehold.co/120x120/3b82f6/ffffff?text=DOKU+W", url: "https://fl1.moveonjoy.com/Nat_Geo_Wild/index.m3u8" }, 
            { name: "HISTORY", logo: "https://placehold.co/120x120/3b82f6/ffffff?text=DOKU+H", url: "https://fl1.moveonjoy.com/history_channel/index.m3u8" }, 
        ]
    };

    const categories = Object.keys(channels);

    // DOM References
    const categoryScreen = document.getElementById('category-screen');
    const fullscreenContainer = document.getElementById('fullscreen-player-container');
    const osdMenu = document.getElementById('osd-menu');
    const osdChannelList = document.getElementById('osd-channel-list');
    const osdMenuTitle = document.getElementById('osd-menu-title');
    
    let currentCategory = 'LIVE TV'; 
    let currentChannel = { url: '', name: '' };
    let focusedArea = 'cats'; // 'cats', 'player', 'osd'
    
    /**
     * Ngarkon burimin e kanalit duke përdorur hls.js (logjika funksionale)
     */
    function loadChannel(channelInfo) {
        if (!currentVideoElement) {
             showMessage("Gabim: Lojtari Nuk U Gjet", "Lojtari i videos nuk u krijua dot. Provoni të rinisni.");
             return;
        }
        
        currentChannel = channelInfo;
        const url = channelInfo.url;
        
        // Pastron instancën e vjetër të hls.js
        if (hlsInstance) {
            try{ hlsInstance.destroy(); }catch(e){} 
            hlsInstance = null; 
        }

        // Përdor hls.js ose riprodhimin natyral siç u dërgua në kodin tuaj
        if (Hls.isSupported()) {
            hlsInstance = new Hls({
                 // Përfshihet crossOrigin për të lejuar ngarkimin e segmenteve
                crossOrigin: 'anonymous', 
                maxBufferLength: 30 
            });
            hlsInstance.loadSource(url);
            hlsInstance.attachMedia(currentVideoElement);
            
            hlsInstance.on(Hls.Events.MANIFEST_PARSED, function() {
                currentVideoElement.play().catch(err => {
                    if (err.name !== 'NotAllowedError') { // Lejon gabimet e Autoplay
                         showMessage("Gabim: S'Po Luhet", `Video Player-i dështoi të luante videon. (Ndoshta burimi është jashtë linje: ${channelInfo.name})`);
                    }
                });
            });

            hlsInstance.on(Hls.Events.ERROR, function (event, data) {
                if (data.fatal) {
                    showMessage("Gabim Fatal i HLS", `Kanali **${channelInfo.name}** dështoi të luhej. Ky mund të jetë një burim i bllokuar (CORS) ose i pavlefshëm. Kthehuni pas dhe provoni një kanal tjetër.`);
                    closePlayer();
                }
            });

        } else if (currentVideoElement.canPlayType('application/vnd.apple.mpegurl')) {
            // Për shfletuesit me mbështetje natyrale (Safari)
            currentVideoElement.src = url;
            currentVideoElement.addEventListener('loadedmetadata', function() {
                currentVideoElement.play().catch(err => {
                     if (err.name !== 'NotAllowedError') {
                         showMessage("Gabim: S'Po Luhet", `Video Player-i dështoi të luante videon. (Ndoshta burimi është jashtë linje: ${channelInfo.name})`);
                    }
                });
            });
        } else {
             showMessage("Gabim: Pa Mbështetje", "Shfletuesi juaj nuk mbështet formatin HLS/M3U8. Provoni një shfletues tjetër (Chrome, Safari).");
             closePlayer();
        }

        // Përditëson klasën 'active' në OSD
        document.querySelectorAll('.osd-channel-item').forEach(item => {
            item.classList.remove('active');
            if (item.dataset.name === channelInfo.name) {
                item.classList.add('active');
            }
        });
        
        // Përditëson titullin e OSD
        osdMenuTitle.textContent = `${channelInfo.name} (${currentCategory})`;
    }

    /**
     * Ndryshon Kategorinë dhe hap kanalin e parë në Fullscreen
     */
    function goToChannelsScreen(category) {
        currentCategory = category;
        const channelList = channels[category];
        if (channelList.length > 0) {
            openPlayer(channelList[0]);
        } else {
            showMessage("Nuk Ka Kanale", `Kategoria '${category}' nuk ka asnjë kanal të listuar.`);
        }
    }
    
    /**
     * Kthehet në ekranin kryesor të kategorive.
     */
    function goToCategoryScreen() {
        fullscreenContainer.classList.add('hidden');
        categoryScreen.classList.remove('hidden');
        focusedArea = 'cats';

        // Gjen dhe fokuson kartën e fundit të fokusuar ose të parën
        setTimeout(() => {
            const focusedCard = document.querySelector(`.category-card[data-cat="${currentCategory}"]`) || document.querySelector('.category-card');
            if (focusedCard) { focusedCard.focus(); }
        }, 100);
    }
    
    /**
     * Hap lojtarin Fullscreen dhe krijon elementin Video.
     */
    function openPlayer(channelInfo) {
        history.pushState({player:true, channel: channelInfo.name, category: currentCategory}, 'player');
        
        categoryScreen.classList.add('hidden');
        fullscreenContainer.classList.remove('hidden');
        fullscreenContainer.innerHTML = '';
        hideOSD();

        const video = document.createElement('video');
        video.id = 'tvplayer';
        video.autoplay = true;
        video.controls = false; // Kontrollet do t'i menaxhojmë me OSD
        video.muted = false;
        video.setAttribute('playsinline','');
        video.style.pointerEvents = 'none'; // Çaktivizon klikimet direkte
        
        fullscreenContainer.appendChild(video);
        currentVideoElement = video;

        loadChannel(channelInfo);
        
        // Kërkon Fullscreen
        const el = fullscreenContainer;
        if (el.requestFullscreen) {
            el.requestFullscreen();
        } else if (el.webkitRequestFullscreen) { 
            el.webkitRequestFullscreen();
        } else if (el.msRequestFullscreen) { 
            el.msRequestFullscreen();
        }
    }
    
    /**
     * Mbyll lojtarin Fullscreen.
     */
    function closePlayer() {
        if (hlsInstance) {
            try{ hlsInstance.destroy(); }catch(e){} 
            hlsInstance = null; 
        }
        if (currentVideoElement) {
            currentVideoElement.pause();
            currentVideoElement = null;
        }

        fullscreenContainer.classList.add('hidden');
        fullscreenContainer.innerHTML = '';
        
        goToCategoryScreen();
    }
    
    /**
     * Shfaq menunë OSD dhe fokuson kanalin aktiv.
     */
    function showOSD() {
        // Krijon listën e kanaleve të kategorisë aktuale për OSD
        renderChannels(osdChannelList, 'osd-channel-item', channels[currentCategory]);

        osdMenu.classList.add('active');
        focusedArea = 'osd';
        
        // Fokuson kanalin aktual
        const activeItem = osdChannelList.querySelector('.osd-channel-item.active');
        if (activeItem) {
            activeItem.focus();
            activeItem.scrollIntoView({ behavior: 'smooth', block: 'center' });
        } else {
            osdChannelList.querySelector('.osd-channel-item')?.focus();
        }
    }

    /**
     * Fsheh menunë OSD.
     */
    function hideOSD() {
        osdMenu.classList.remove('active');
        focusedArea = 'player'; // Lojtari është i fokusuar
        document.body.focus(); 
    }

    /**
     * Ndërton kartat e kategorive.
     */
    function renderCategoryCards() {
        const categoryCardsContainer = document.getElementById('category-cards-container');
        categoryCardsContainer.innerHTML = ''; 
        categories.forEach(category => {
            const card = document.createElement('button');
            card.className = 'category-card interactive-item px-10 py-6 m-2 rounded-xl shadow-xl bg-gray-700/80 text-center font-bold text-xl flex-shrink-0';
            card.textContent = category;
            card.setAttribute('tabindex', '0'); 
            card.setAttribute('data-cat', category);
            card.addEventListener('click', () => { goToChannelsScreen(category); });
            
            categoryCardsContainer.appendChild(card);
        });
        
        // Fokuson kartën e parë pas ngarkimit
        setTimeout(() => {
            categoryCardsContainer.querySelector('.category-card')?.focus();
        }, 300);
    }
    
    /**
     * Ndërton listën e kanaleve për OSD.
     */
    function renderChannels(targetContainer, itemClass, channelList) {
        targetContainer.innerHTML = ''; 
        
        channelList.forEach((channel) => {
            const channelItem = document.createElement('button');
            channelItem.className = `${itemClass} interactive-item flex items-center p-3 rounded-lg border-2 border-transparent hover:bg-gray-700/80 w-full text-left`;
            channelItem.setAttribute('tabindex', '0'); 
            channelItem.setAttribute('data-name', channel.name);
            channelItem.setAttribute('data-url', channel.url);
            
            // Shenja (Logo)
            const logo = document.createElement('img');
            logo.className = 'w-10 h-10 object-contain rounded-full bg-white p-1 mr-3';
            logo.src = channel.logo || 'https://placehold.co/40x40/4b5563/ffffff?text=TV';
            logo.alt = `${channel.name} Logo`;

            // Emri i kanalit
            const nameElement = document.createElement('span');
            nameElement.className = 'text-base font-medium truncate';
            nameElement.textContent = channel.name;

            channelItem.appendChild(logo);
            channelItem.appendChild(nameElement);

            // Vendos kanalin aktiv
            if (channel.name === currentChannel.name && channel.url === currentChannel.url) {
                channelItem.classList.add('active');
            }

            channelItem.addEventListener('click', () => {
                document.querySelectorAll(`.${itemClass}`).forEach(item => item.classList.remove('active'));
                channelItem.classList.add('active');
                
                const channelInfo = { name: channel.name, url: channel.url, logo: channel.logo };

                // Në OSD Menu, ndryshon kanalin në Fullscreen
                loadChannel(channelInfo);
                hideOSD();
            });
            
            targetContainer.appendChild(channelItem);
        });
    }

    // --------------------------------------------------------------------------------
    // NAVIGIMI ME TASTIERË (Për TV/Telekomandë)
    // --------------------------------------------------------------------------------

    document.addEventListener('keydown', (e) => {
        const isPlayerOpen = !fullscreenContainer.classList.contains('hidden');
        const isOSDVisible = osdMenu.classList.contains('active');
        const focused = document.activeElement;
        
        // Kur lojtari është hapur
        if (isPlayerOpen) {
            if (e.key === 'Enter' || e.key === ' ' || e.key === 'MediaPlayPause') { // OK/Enter key
                e.preventDefault();
                isOSDVisible ? focused?.click() : showOSD();
                return;
            } else if (e.key === 'Escape' || e.key === 'Backspace' || e.key === 'Menu') { // Back/Menu key
                e.preventDefault();
                if (isOSDVisible) {
                    hideOSD();
                } else {
                    // Mbyll player-in dhe kthehet te kategoritë
                    history.back(); 
                }
                return;
            }
            
            // Kur OSD është e hapur, përdor shigjetat
            if (isOSDVisible) {
                const items = Array.from(osdChannelList.querySelectorAll('.osd-channel-item'));
                let idx = items.findIndex(item => item === focused);
                
                if (e.key === 'ArrowDown' && idx < items.length - 1) {
                    e.preventDefault();
                    items[idx + 1].focus();
                    items[idx + 1].scrollIntoView({ behavior: 'smooth', block: 'center' });
                } else if (e.key === 'ArrowUp' && idx > 0) {
                    e.preventDefault();
                    items[idx - 1].focus();
                    items[idx - 1].scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
                return;
            }
        } 
        
        // Kur jemi te Kategoritë
        else {
             if (e.key === 'Enter') {
                e.preventDefault();
                focused?.click();
                return;
            }
            
             // Lëvizja brenda elementeve fokusable natyrale
             // Lejo navigimin natyral me Tab/Shift+Tab, dhe shigjetat mund të përdoren për lëvizjen e fokusit ndërmjet butonave.
        }
    });

    // --------------------------------------------------------------------------------
    // FUNKSIONALITETET NDIHMËSE
    // --------------------------------------------------------------------------------

    // Mbyll player-in kur del nga fullscreen (p.sh. me Esc ose swipe)
    document.addEventListener('fullscreenchange', () => { 
        if (!document.fullscreenElement && !fullscreenContainer.classList.contains('hidden')) { 
            closePlayer(); 
            // Nëse përdoruesi del nga fullscreen, ktheje historinë pas.
            if (history.state && history.state.player) {
                 history.back(); 
            }
        } 
    });
    
    // Përdor 'popstate' për të menaxhuar butonin e kthimit (Back) të shfletuesit
    window.addEventListener('popstate', (e) => {
        // Kontrollon nëse kemi një gjendje lojtari në histori
        const isPlayerState = history.state && history.state.player;

        if (isPlayerState && fullscreenContainer.classList.contains('hidden')) {
            // Player-i është mbyllur, por gjendja e fundit ishte player, kthehu te kategoritë
            goToCategoryScreen();
        } else if (!isPlayerState && !fullscreenContainer.classList.contains('hidden')) {
             // Player-i ishte hapur, por gjendja e re nuk është player, mbyll player-in
             closePlayer();
        }
    });
    
    // Mesazh Modal UI (për gabimet e player-it)
    function showMessage(title, message) {
        const modal = document.getElementById('ui-message-box');
        document.getElementById('modal-title').textContent = title;
        document.getElementById('modal-message').innerHTML = message;
        
        const closeButton = document.getElementById('modal-close-button');
        
        function closeModal() {
             modal.classList.remove('visible');
             closeButton.removeEventListener('click', closeModal);
             document.removeEventListener('keydown', handleModalKeydown);
             // Kthehuni në fokusin e fundit aktiv (Kategoria)
             document.querySelector('.category-card')?.focus();
        }

        function handleModalKeydown(e) {
            if (e.key === 'Enter' || e.key === 'Escape' || e.key === 'Backspace') {
                e.preventDefault();
                closeModal();
            }
        }
        
        closeButton.onclick = closeModal;
        
        setTimeout(() => {
            modal.classList.add('visible');
            closeButton.focus();
            document.addEventListener('keydown', handleModalKeydown);
        }, 50);
    }


    // --------------------------------------------------------------------------------
    // INICIALIZIMI FILLITAR
    // --------------------------------------------------------------------------------
    window.onload = function() {
        renderCategoryCards();
    };

</script>
</body>
</html>
