<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>TV App UI - Versioni 16:9 (6 Kanale, Pa EPG) - V26</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">

<style>
    /* --- STILIMET KRYESORE --- */
    html, body {
        height: 100%; 
        min-height: 100vh;
    }

    body { 
        background: #1e1e1e; 
        font-family:'Rubik',sans-serif; 
        color:#fff; 
        margin:0; 
        overflow-x: hidden;
        display: flex; 
        flex-direction: column; 
        align-items: center; 
    } 
    
    /* SFONDI STATIK I IMZHIT */
    #background-image {
        position: fixed;
        right: 0;
        bottom: 0;
        min-width: 100%; 
        min-height: 100%;
        width: auto;
        height: auto;
        z-index: -2; 
        object-fit: cover;
        background-image: url("https://i.imgur.com/yeiw0tZ.jpeg");
        background-size: cover;
        background-position: center;
        filter: brightness(0.6); 
    }

    /* --- WIDGET I ORĖS DHE MOTIT (POSHTĖ NĖ TĖ DJATHTĖ) --- */
    #headerWidget {
        position: fixed;
        bottom: 20px; 
        right: 20px; 
        color: #fff;
        text-align: right; 
        z-index: 10;
        pointer-events: none; 
        background: rgba(0, 0, 0, 0.4);
        backdrop-filter: blur(5px);
        border-radius: 14px;
        padding: 10px 20px;
    } 

    #weatherSummary {
        font-size: 1.2em; 
        font-weight: 500; 
        color: rgba(255, 255, 255, 0.9); 
        margin-bottom: 5px; 
    }

    #currentTime {
        font-size: 2.5em; 
        font-weight: 700; 
        line-height: 1;
        margin: 0;
    }

    #currentDate {
        font-size: 0.9em; 
        font-weight: 400; 
        margin-top: 5px; 
        line-height: 1.2;
        color: rgba(255, 255, 255, 0.8); 
    } 

    /* --- KONTEJNERI KRYESOR PĖR QENDRĖZIM --- */
    #mainContent {
        display: flex;
        flex-direction: column;
        align-items: center; 
        padding: 40px; 
        padding-top: 20px; 
        margin-top: 20px; 
        width: 100%; 
        max-width: 100%; 
        box-sizing: border-box;
    } 

    /* KATEGORITĖ & GRIDI I KANALEVE */
    .categories { 
        display:flex; 
        gap: 20px; 
        margin-bottom: 40px; 
        justify-content: center; 
        width: 100%; 
        padding-top: 0; 
    } 

    .cat-btn { 
        background: none; 
        color:#fff; 
        padding:15px 28px; 
        font-size: 1.3em; 
        font-weight: 600; 
        cursor:pointer; 
        transition: transform .15s ease-out;
        border: none; 
        border-radius: 0;
        position: relative; 
        margin: 0; 
        outline: none;
    }

    .cat-btn::after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 0;
        height: 4px;
        background-color: #fff;
        border-radius: 2px;
        transition: width 0.1s ease-out;
    }

    .cat-btn:focus, .cat-btn.focused { 
        background: none; 
        color: #fff;
        transform: scale(1.05); 
        box-shadow: none; 
    }
    
    .cat-btn:focus::after, .cat-btn.focused::after {
        width: 30px; 
    }

    /* Rregullimi i Gridit - 6 Kanale Horizontalisht */
    .grid { 
        grid-template-columns: repeat(6, 160px); /* KRYESOR: Zëvendësuar 8 me 6 */
        gap: 25px 20px; 
        display:grid; 
        justify-content: center; 
        width: 100%; 
    } 

    /* --- STILIMI I KANALIT (16:9) --- */
    .channel-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0; 
        position: relative;
    }

    .channel { 
        width: 160px; 
        height: 90px; 
        background: rgba(0, 0, 0, 0.4); 
        border-radius: 8px; 
        box-shadow: 0 4px 15px rgba(0,0,0,.4); 
        display:flex; 
        justify-content:center; 
        align-items:center; 
        cursor:pointer; 
        transition: transform .1s ease-out, box-shadow .1s ease-out; 
        border: 3px solid transparent; 
        overflow: hidden; 
        padding: 5px; 
        box-sizing: border-box;
    }

    .channel:focus, .channel.focused { 
        transform: scale(1.1); 
        border: 3px solid #6246B8; 
        box-shadow: 0 8px 30px rgba(98, 70, 184, 0.6); 
        outline:none; 
    }
    .channel:active { transform:scale(0.98); } 

    .channel img { 
        max-width: 90%; 
        max-height: 90%; 
        object-fit: contain; 
        filter: saturate(1); 
        transition: filter 0.1s, transform 0.1s; 
    } 

    .channel:focus img, .channel.focused img { 
        filter: saturate(1.2); 
        transform: none; 
    }
    
    /* Hequr: Stilimi i EPG-së (epg-info) */


    /* --- PLAYER CONTAINER --- */
    #playerContainer { 
        position:fixed; 
        inset:0; 
        background:#000; 
        display:none; 
        z-index:99999; 
        align-items:center; 
        justify-content:center; 
    }
    #playerContainer video { 
        width:100vw; 
        height:100vh; 
        object-fit:contain; 
        outline:none; 
        border:0; 
        pointer-events:none; 
    } 
    
    /* Info Bar */
    #infoBar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 80px; 
        background: linear-gradient(to top, rgba(0, 0, 0, 0.9), rgba(0, 0, 0, 0)); 
        padding: 10px 40px 10px 40px; 
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        opacity: 0;
        pointer-events: none;
        transform: translateY(100%); 
        transition: opacity 0.5s, transform 0.5s ease-out; 
        z-index: 99999;
        justify-content: center; 
    } 

    #infoBar.visible {
        opacity: 1;
        transform: translateY(0%);
    } 

    .channel-title {
        font-size: 2.2em;
        font-weight: 700;
        color: #fff;
        line-height: 1;
    } 
    /* EPG info u hoq plotësisht nga HTML */


    /* Loading/Error Overlay */
    #loadingOverlay {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.7);
        display: none; 
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 100000; 
    } 
    #loadingOverlay .message {
        font-size: 1.5em;
        font-weight: 500;
        color: #fff;
        margin-top: 20px;
    } 
    .spinner {
        border: 5px solid rgba(255, 255, 255, 0.3);
        border-top: 5px solid #6246B8;
        border-radius: 50%;
        width: 50px;
        height: 50px;
        animation: spin 1s linear infinite;
    } 
    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    } 

    /* --- MENYJA ANĖSORE --- */
    #channelMenu {
        position: absolute;
        top: 0;
        left: 0;
        height: 100vh; 
        width: 350px; 
        padding: 20px 0;
        background: rgba(0, 0, 0, 0.95); 
        border-right: 1px solid rgba(255, 255, 255, 0.1); 
        overflow-y: auto; 
        overflow-x: hidden;
        display: none; 
        z-index: 100001; 
        transform: translateX(-100%); 
        transition: transform 0.3s ease-out; 
    } 

    #channelMenu.active {
        transform: translateX(0);
    }
    
    .menu-channel-item {
        display: flex;
        align-items: center;
        padding: 10px 20px;
        cursor: pointer;
        transition: background-color 0.2s, transform 0.2s, border-left-color 0.2s;
        border-left: 5px solid transparent; 
        outline: none;
        color: #ddd;
        font-size: 1.1em;
    }

    .menu-channel-item.focused {
        background-color: rgba(65, 105, 225, 0.3); 
        border-left-color: #4169e1; 
        color: #fff;
        transform: scale(1.03);
        box-shadow: 
            0 0 10px rgba(65, 105, 225, 0.3),
            5px 0 15px rgba(0, 0, 0, 0.5); 
        border-top-right-radius: 8px;
        border-bottom-right-radius: 8px;
    } 
    
    .menu-channel-number {
        font-weight: 700;
        min-width: 35px;
        text-align: right;
        margin-right: 15px;
        color: #4169e1;
    }
    
</style>
</head>
<body>
    
    <div id="background-image"></div>
    
    <div id="headerWidget">
        <div id="timeDate">
            <span id="weatherSummary"></span> 
            <span id="currentTime">--:--</span>
            <span id="currentDate">--/--</span>
        </div> 
    </div>
    
    <div id="mainContent">
        <div class="categories" id="categories" role="toolbar" aria-label="Categories"></div>
        <div class="grid" id="grid" role="grid"></div> 
    </div> 

    <div id="playerContainer">
        <div id="loadingOverlay">
            <div class="spinner"></div>
            <div class="message">Po ngarkohet...</div>
        </div> 
        <video id="tvplayer" autoplay playsinline muted></video>
        <div id="infoBar">
            <div class="channel-title"></div>
        </div> 
        <div id="channelMenu"></div>
    </div> 

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script>
// --- KONFIGURIMI I APLIKACIONIT ---
const CHANNELS_JSON_URL = "channels.json"; 
const GRID_COLS = 6; /* KRYESOR: Ndryshuar nga 8 në 6 */

// --- Variablat globale ---
let allChannelsData = {}; 
let categories = []; 
let allChannelsList = []; 
let hls = null;

// --- DOM refs dhe State ---
const catWrap = document.getElementById('categories');
const grid = document.getElementById('grid');
const playerContainer = document.getElementById('playerContainer');
let currentCategory = 'LIVE TV'; 
let currentFocusedElement = null; 
let focusedArea = 'cats'; 
let catFocus = 0;
let gridFocus = 0;
let isMenuVisible = false;
let menuFocusIndex = 0;
let currentChannelIndex = 0; 
let infoBarTimer = null; 
let digitBuffer = ''; 
let digitTimer = null; 
let isInitializing = true; 

// --- FILLESA DHE MIGRIMI I TË DHËNAVE ---
async function initializeApp() {
    try {
        await fetchChannelData();

        // 3. Ruajtja e Kategorisë dhe Kanalit të Fundit
        currentCategory = localStorage.getItem('lastCategory') || categories[0] || 'LIVE TV';
        const lastChannelIndex = parseInt(localStorage.getItem('lastChannelIndex'));
        
        if (!isNaN(lastChannelIndex) && lastChannelIndex < allChannelsList.length) {
            currentChannelIndex = lastChannelIndex;
            const lastChannel = allChannelsList[currentChannelIndex];
            currentCategory = lastChannel.category;
            const categoryChannels = allChannelsData[currentCategory];
            gridFocus = categoryChannels.findIndex(ch => ch.fullIndex === currentChannelIndex);
            
            focusedArea = 'grid'; 
        } else {
             currentChannelIndex = 0;
             gridFocus = 0;
             focusedArea = 'cats'; 
        }

        renderCategories();
        loadCategory(currentCategory);
        
    } catch (error) {
        console.error("Gabim në inicializimin e aplikacionit:", error);
        alert("Gabim gjatë ngarkimit të të dhënave të aplikacionit. Kontrolloni skedarin channels.json.");
    } finally {
         isInitializing = false;
    }
}

async function fetchChannelData() {
    const response = await fetch(CHANNELS_JSON_URL);
    if (!response.ok) {
        throw new Error("Nuk u gjet skedari channels.json");
    }
    allChannelsData = await response.json();
    categories = Object.keys(allChannelsData);
    
    // Krijo listën e sheshuar (Flat List) dhe shtoj Indexing
    let counter = 0;
    allChannelsList = [];
    categories.forEach(categoryName => {
        const list = allChannelsData[categoryName] || [];
        list.forEach(channel => {
            channel.fullIndex = counter;
            channel.number = counter + 1;
            channel.category = categoryName; 
            allChannelsList.push(channel);
            counter++;
        });
    });
}

// --- RENDERIMI I UI ---
function renderCategories(){
    catWrap.innerHTML = '';
    categories.forEach((cat,ci)=>{
        const btn = document.createElement('button');
        btn.className = 'cat-btn';
        btn.textContent = cat;
        btn.setAttribute('data-cat',cat);
        btn.tabIndex = 0;
        btn.onclick = ()=> loadCategory(cat);
        btn.onfocus = ()=> { focusedArea = 'cats'; catFocus = ci; } 
        
        if(cat === currentCategory) {
            btn.classList.add('focused');
        }

        catWrap.appendChild(btn);
    });
}

function loadCategory(cat){
    currentCategory = cat;
    localStorage.setItem('lastCategory', cat); 
    
    catWrap.querySelectorAll('.cat-btn').forEach(btn => {
        btn.classList.toggle('focused', btn.getAttribute('data-cat') === cat);
    });

    grid.innerHTML = '';
    
    const list = allChannelsData[cat] || [];
    list.forEach((ch,idx)=>{
        const wrap = document.createElement('div');
        wrap.className = 'channel-wrap';
        
        const box = document.createElement('button');
        box.className = 'channel';
        box.tabIndex = 0;
        box.setAttribute('data-idx', idx);
        
        ch.gridIndex = idx;
        wrap.channelData = ch;

        const logo = document.createElement('img');
        logo.src = ch.logo;
        logo.alt = ch.name;
        box.appendChild(logo);
        
        // Hequr: Elementi vizual i EPG-së nga kanalet
        
        box.onfocus = ()=> { 
            focusedArea = 'grid'; 
            gridFocus = idx;
        } 
        
        box.onclick = ()=> openPlayerForChannel(ch);
        
        wrap.appendChild(box);
        grid.appendChild(wrap);
    });
    
    catFocus = categories.indexOf(cat) >= 0 ? categories.indexOf(cat) : 0;
    
    if (isInitializing && focusedArea === 'grid') {
        // Lë gridFocus siç është, pasi u llogarit më lart
    } else {
         gridFocus = 0; 
         focusedArea = 'cats'; 
    }
    
    focusCurrent();
} 

function focusCurrent(){
    if (currentFocusedElement) {
        currentFocusedElement.classList.remove('focused');
    }

    let targetElement = null;
    
    catWrap.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('focused'));

    if(focusedArea === 'cats'){
        const cats = catWrap.querySelectorAll('.cat-btn');
        if (cats[catFocus]) {
            targetElement = cats[catFocus];
            targetElement.classList.add('focused');
        }
    } else {
        const wraps = grid.querySelectorAll('.channel-wrap');
        if (wraps[gridFocus]) {
            targetElement = wraps[gridFocus].querySelector('.channel');
            targetElement.classList.add('focused');
        }
    }
    
    if (targetElement) {
        targetElement.focus(); 
        currentFocusedElement = targetElement;
    }
} 

function showInfoBar(ch) {
    const infoBar = document.getElementById('infoBar');
    const title = infoBar.querySelector('.channel-title');

    if (!infoBar || !title) return; 
    
    // KRYESOR: Shfaq vetëm emrin dhe numrin e kanalit
    title.textContent = `${ch.number || currentChannelIndex + 1} | ${ch.name}`;

    infoBar.classList.add('visible'); 
    
    if (infoBarTimer) clearTimeout(infoBarTimer); 

    infoBarTimer = setTimeout(() => {
        infoBar.classList.remove('visible');
    }, 5000);
} 

function switchChannel(ch){
    if(!ch.url) return;
    
    if (ch.fullIndex === currentChannelIndex && isMenuVisible) {
        toggleChannelMenu(); 
        return; 
    }
    
    if (isMenuVisible) {
        toggleChannelMenu(); 
    }
    
    currentChannelIndex = ch.fullIndex; 
    menuFocusIndex = ch.fullIndex; 
    localStorage.setItem('lastChannelIndex', currentChannelIndex); 

    openPlayerForChannel(ch, true);
}


function openPlayerForChannel(ch, isSwitching = false){
    const url = ch.url;
    if(!url) {
        if (!isSwitching) {
            alert(`Kanali "${ch.name}" nuk ka një URL aktive.`);
        } else {
            updateLoadingState('error', ch.name);
        }
        return;
    }
    
    updateLoadingState('loading');
    showInfoBar(ch); 

    if (ch.fullIndex !== undefined) {
        currentChannelIndex = ch.fullIndex;
        menuFocusIndex = ch.fullIndex;
        localStorage.setItem('lastChannelIndex', currentChannelIndex); 
    } else {
        const foundIndex = allChannelsList.findIndex(channel => channel.url === url);
        if (foundIndex !== -1) {
            currentChannelIndex = foundIndex;
            menuFocusIndex = foundIndex;
            localStorage.setItem('lastChannelIndex', currentChannelIndex); 
        }
    }

    const video = document.getElementById('tvplayer');
    const channelMenu = document.getElementById('channelMenu');
    
    if (!isSwitching) {
        document.body.style.overflow = 'hidden';
        document.getElementById('mainContent').style.display = 'none'; 
        history.pushState({player:true}, 'player');
        playerContainer.style.display = 'flex';
        updateOrientationClass(); 
    }
    
    // POPULLO DHE FSHEH MENYNĖ ANĖSORE (e njejte)
    if (channelMenu) {
        channelMenu.innerHTML = '';
        allChannelsList.forEach((channelData, index) => {
            const item = document.createElement('div');
            item.className = 'menu-channel-item';
            
            const channelNumber = document.createElement('span');
            channelNumber.className = 'menu-channel-number';
            channelNumber.textContent = channelData.number;
            
            const channelName = document.createElement('span');
            channelName.textContent = channelData.name;
            
            item.appendChild(channelNumber);
            item.appendChild(channelName);
            
            item.setAttribute('data-url', channelData.url);
            item.setAttribute('data-index', index);
            item.tabIndex = 0; 
            
            if (index === currentChannelIndex) {
                item.classList.add('focused');
            }
            
            item.onclick = () => switchChannel(channelData); 
            channelMenu.appendChild(item);
        });
        isMenuVisible = false;
        channelMenu.classList.remove('active'); 
        channelMenu.style.display = 'none';
    }


    // Luaj me hls.js (e njejte)
    if(hls){ try{ hls.destroy(); }catch(e){} hls = null; }
    
    if(Hls && Hls.isSupported()){
        hls = new Hls({ maxBufferLength: 10 }); 
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, function(){ 
            video.play().catch(()=>{}); 
        });
        hls.on(Hls.Events.ERROR, function(event, data){
            if (data.fatal) {
                updateLoadingState('error', ch.name);
                console.error('HLS Fatal Error:', data.details);
            }
        });
    } else {
        video.src = url;
        video.play().catch(()=>{});
    } 

    video.onplaying = () => { updateLoadingState('hidden'); };
    video.onerror = () => { updateLoadingState('error', ch.name); } 

    try{ if(screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape'); }catch(e){} 
    const req = video.requestFullscreen || video.webkitRequestFullscreen || video.msRequestFullscreen;
    try{ req && req.call(video).catch(()=>{}); }catch(e){}
} 

// --- LOGJIKA E NAVIGIMIT ---
document.addEventListener('keydown', (e)=>{
    
    if(playerContainer.style.display === 'flex'){
        
        const channelMenu = document.getElementById('channelMenu');
        const menuItems = channelMenu ? channelMenu.querySelectorAll('.menu-channel-item') : [];
        const MAX_CHANNEL_INDEX = allChannelsList.length - 1; 

        // Logjika e numrave
        if (e.key >= '0' && e.key <= '9') {
            e.preventDefault();
            
            if (digitTimer) clearTimeout(digitTimer);
            
            if (digitBuffer.length < 3) {
                digitBuffer += e.key;
            } else {
                digitBuffer = e.key;
            }
            
            const infoBar = document.getElementById('infoBar');
            const title = infoBar.querySelector('.channel-title');

            // KRYESOR: Shfaq vetëm numrin e shkruar
            title.textContent = `Kanali: ${digitBuffer}`;
            infoBar.classList.add('visible'); 

            if (infoBarTimer) clearTimeout(infoBarTimer);
            
            digitTimer = setTimeout(() => {
                let targetNumber = parseInt(digitBuffer);
                
                if (targetNumber > 0 && targetNumber <= allChannelsList.length) {
                    const targetChannel = allChannelsList[targetNumber - 1];
                    switchChannel(targetChannel); 
                }
                
                digitBuffer = '';
                
                if (allChannelsList[currentChannelIndex]) {
                    showInfoBar(allChannelsList[currentChannelIndex]); 
                } else {
                    infoBar.classList.remove('visible');
                }
            }, 1000); 
            
            return; 
        }
        
        // KONTROLLA E MENYSĖ
        if(isMenuVisible){
            if(e.key === 'ArrowUp'){
                menuItems[menuFocusIndex]?.classList.remove('focused');
                menuFocusIndex = Math.max(0, menuFocusIndex - 1);
                menuItems[menuFocusIndex]?.classList.add('focused');
                centerMenuFocus(menuItems, menuFocusIndex); 
            } else if(e.key === 'ArrowDown'){
                menuItems[menuFocusIndex]?.classList.remove('focused');
                menuFocusIndex = Math.min(MAX_CHANNEL_INDEX, menuFocusIndex + 1);
                menuItems[menuFocusIndex]?.classList.add('focused');
                centerMenuFocus(menuItems, menuFocusIndex); 
            } else if(e.key === 'Enter'){
                const channel = allChannelsList[menuFocusIndex];
                switchChannel(channel);
            }
            return; 
        } 

        // NDĖRRIMI SEKUENCIAL ME UP/DOWN
        if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
            
            if (digitTimer) clearTimeout(digitTimer);
            digitBuffer = '';
            
            let newIndex = currentChannelIndex;
            
            if (e.key === 'ArrowUp') {
                newIndex = currentChannelIndex > 0 ? currentChannelIndex - 1 : MAX_CHANNEL_INDEX;
            } else if (e.key === 'ArrowDown') {
                newIndex = currentChannelIndex < MAX_CHANNEL_INDEX ? currentChannelIndex + 1 : 0;
            }
            
            const nextChannel = allChannelsList[newIndex];
            currentChannelIndex = newIndex; 
            openPlayerForChannel(nextChannel, true); 
            return;
        }


        // OK/ENTER: HAP MENUNĖ E KANALIT dhe shfaq Info Bar
        if(e.key === 'Enter'){
            if (digitBuffer.length > 0) {
                let targetNumber = parseInt(digitBuffer);
                if (targetNumber > 0 && targetNumber <= allChannelsList.length) {
                    const targetChannel = allChannelsList[targetNumber - 1];
                    switchChannel(targetChannel); 
                }
                if (digitTimer) clearTimeout(digitTimer);
                digitBuffer = '';
            } else {
                const currentChannel = allChannelsList[currentChannelIndex];
                showInfoBar(currentChannel);
                toggleChannelMenu();
            }
        } 

        // BACKSPACE/ESCAPE: Mbyll player-in
        if(e.key === 'Backspace' || e.key === 'Escape'){ 
            if (digitTimer) clearTimeout(digitTimer); 
            digitBuffer = '';
            closePlayer(); 
            history.back(); 
        }
        
        return; 
    }
    
    // KONTROLLAT E NAVIGIMIT TĖ UI-SĖ (jashtė player-it)
    const gridItems = grid.querySelectorAll('.channel-wrap');
    
    if(e.key === 'ArrowRight'){
        if(focusedArea === 'cats') { 
            catFocus = Math.min(catFocus + 1, categories.length - 1); 
        } else { 
            gridFocus = Math.min(gridFocus + 1, gridItems.length - 1); 
        }
    }
    else if(e.key === 'ArrowLeft'){
        if(focusedArea === 'cats') { 
            catFocus = Math.max(catFocus - 1, 0); 
        } else { 
            gridFocus = Math.max(gridFocus - 1, 0); 
        }
    }
    else if(e.key === 'ArrowDown'){
        if(focusedArea === 'cats'){
            focusedArea = 'grid';
            gridFocus = Math.min(catFocus, gridItems.length - 1); 
            if (gridFocus < 0) gridFocus = 0; 
        } else {
            const newIndex = gridFocus + GRID_COLS;
            if (newIndex < gridItems.length) {
                gridFocus = newIndex;
            } 
        }
    }
    else if(e.key === 'ArrowUp'){
        if(focusedArea === 'grid'){
            if(gridFocus < GRID_COLS){ 
                focusedArea = 'cats';
                catFocus = Math.min(gridFocus, categories.length - 1);
            } else {
                gridFocus = gridFocus - GRID_COLS;
            }
        }
    } 

    // Kontrolli për kufijtë
    if(gridItems.length > 0 && gridFocus >= gridItems.length) gridFocus = gridItems.length - 1;
    if(gridFocus < 0) gridFocus = 0; 
    
    if(e.key === 'Enter'){
        if(focusedArea === 'cats'){
            loadCategory(categories[catFocus]);
            focusedArea = 'grid'; 
            gridFocus = 0; 
        } else {
            grid.querySelectorAll('.channel-wrap')[gridFocus]?.querySelector('.channel').click();
        }
    }
    
    focusCurrent();
}); 

// initial load
document.addEventListener('DOMContentLoaded', ()=>{
    initializeApp();
    updateClock(); 
    loadSuharekeWeather(); 
    setInterval(updateClock, 60000); 
    setInterval(loadSuharekeWeather, 600000); 
});

function updateClock() {
    const now = new Date();
    const timeString = now.toLocaleTimeString('sq-AL', { hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
    const dateString = now.toLocaleDateString('sq-AL', { weekday: 'long', day: 'numeric', month: 'long' });
    
    document.getElementById('currentTime').textContent = timeString;
    document.getElementById('currentDate').textContent = dateString;
} 

async function fetchWeather(lat, lon, cityName) {
    const weatherSummary = document.getElementById('weatherSummary');
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&timezone=auto`; 

    try {
        const response = await fetch(url);
        if (!response.ok) {
            throw new Error(`Gabim HTTP: ${response.status}`);
        }
        const data = await response.json(); 

        const currentTemp = Math.round(data.current.temperature_2m);
        const currentCode = data.current.weather_code;
        const currentWeatherDesc = getWeatherDescription(currentCode);
        
        weatherSummary.innerHTML = `${currentWeatherDesc.emoji} ${currentTemp}°C`; 
        
    } catch (error) {
        console.error("Gabim në marrjen e motit:", error);
        weatherSummary.innerHTML = `? --°C`;
    }
} 

function getWeatherDescription(code) {
    if (code === 0) return { description: "Diell i pastër", emoji: "☀️" };
    if (code === 1) return { description: "Kryesisht diell", emoji: "🌤️" };
    if (code === 2) return { description: "Pjesërisht i vranët", emoji: "⛅" };
    if (code === 3) return { description: "Moti i vranët", emoji: "☁️" };
    if (code === 45 || code === 48) return { description: "Mjegull", emoji: "🌫️" };
    if (code >= 51 && code <= 55) return { description: "Shi i lehtë", emoji: "🌧️" };
    if (code >= 61 && code <= 65) return { description: "Shi i fortë", emoji: "☔" };
    if ((code >= 71 && code <= 77) || (code >= 85 && code <= 86) || code === 66 || code === 67) {
        return { description: "Borë", emoji: "❄️" };
    }
    if (code >= 80 && code <= 82) return { description: "Stuhi me shi", emoji: "⛈️" };
    if (code >= 95 && code <= 99) return { description: "Stuhi", emoji: "⚡" };
    return { description: "Moti i Panjohur", emoji: "❓" }; 
} 

function loadSuharekeWeather() {
    const suharekeLat = 42.36; 
    const suharekeLon = 20.84; 
    fetchWeather(suharekeLat, suharekeLon);
}

function centerMenuFocus(menuItems, index) {
    const channelMenu = document.getElementById('channelMenu');
    const focusedItem = menuItems[index]; 

    if (!focusedItem || !channelMenu) return; 

    const itemHeight = focusedItem.offsetHeight; 
    const menuHeight = channelMenu.clientHeight; 
    const targetScrollTop = focusedItem.offsetTop - (menuHeight / 2) + (itemHeight / 2); 

    channelMenu.scrollTo({ 
        top: targetScrollTop, 
        behavior: 'auto' 
    });
} 

function toggleChannelMenu(){
    const channelMenu = document.getElementById('channelMenu');
    if (!channelMenu) return; 

    isMenuVisible = !isMenuVisible;
    
    if(isMenuVisible) {
        channelMenu.classList.add('active'); 
        channelMenu.style.display = 'block';
    } else {
        channelMenu.classList.remove('active');
        setTimeout(() => {
            channelMenu.style.display = 'none';
        }, 300); 
    }
    
    if (isMenuVisible) {
        const items = channelMenu.querySelectorAll('.menu-channel-item');
        if(items.length > 0) {
            items.forEach(i => i.classList.remove('focused')); 
            menuFocusIndex = Math.min(Math.max(0, currentChannelIndex), items.length - 1); 
            items[menuFocusIndex].classList.add('focused');
            centerMenuFocus(items, menuFocusIndex); 
        }
    }
} 

function updateLoadingState(state, channelName = null) {
    const overlay = document.getElementById('loadingOverlay');
    const spinner = overlay.querySelector('.spinner');
    const message = overlay.querySelector('.message'); 

    if (!overlay) return; 

    if (state === 'loading') {
        spinner.style.display = 'block';
        message.classList.remove('error-text');
        message.textContent = 'Po ngarkohet...';
        overlay.style.display = 'flex';
    } else if (state === 'error') {
        spinner.style.display = 'none';
        message.classList.add('error-text');
        message.textContent = `Kanali nuk punon: ${channelName || 'Pritet lidhja'}`;
        overlay.style.display = 'flex';
    } else if (state === 'hidden') {
        overlay.style.display = 'none';
    }
} 

function closePlayer(){
    document.body.style.overflow = 'auto'; 
    document.getElementById('mainContent').style.display = 'flex'; 
    isMenuVisible = false; 
    
    if(hls){ try{ hls.destroy(); }catch(e){} hls = null; }
    const video = document.getElementById('tvplayer');
    if (video) {
        video.pause();
        video.src = "";
    }
    
    const menu = document.getElementById('channelMenu');
    if (menu) {
        menu.classList.remove('active'); 
        setTimeout(() => {
            menu.style.display = 'none';
        }, 300);
    }

    updateLoadingState('hidden'); 
    if (infoBarTimer) {
        clearTimeout(infoBarTimer); 
        document.getElementById('infoBar').classList.remove('visible');
    }
    if (digitTimer) clearTimeout(digitTimer); 
    digitBuffer = '';
    
    playerContainer.style.display = 'none';
    
    try{ if(screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); }catch(e){}
    
    focusCurrent();
} 

function updateOrientationClass(){
    const w = window.innerWidth, h = window.innerHeight;
    const playerContainer = document.getElementById('playerContainer');
    if(w>h) { playerContainer.classList.add('video-landscape'); playerContainer.classList.remove('video-portrait'); }
    else { playerContainer.classList.add('video-portrait'); playerContainer.classList.remove('video-landscape'); }
}
window.addEventListener('resize', updateOrientationClass);
window.addEventListener('orientationchange', updateOrientationClass); 

window.addEventListener('popstate', (e)=>{
    if(playerContainer.style.display === 'flex'){
        closePlayer();
    }
}); 

window.addEventListener('keydown', (e)=>{
    if(e.key === 'Escape' || e.key === 'Backspace'){
        if(playerContainer.style.display === 'flex' && !isMenuVisible){
            if(window.history.state && window.history.state.player){
                 history.back(); 
            } else {
                closePlayer();
            }
        }
    }
});
